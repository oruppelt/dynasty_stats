# Rebuilds the data of every season still in progress (pipeline/seasons.json) from Fantrax and
# commits it when it changed. Runs after each scoring period ends and once a day (see the schedule).
# The commit to main triggers Render to redeploy the static site.
#
# Run it by hand from GitHub: Actions → "Refresh league data" → "Run workflow". Type a season
# there (e.g. 2021-22, or several comma-separated) to build just those, finished ones too: that's
# how a past season listed in pipeline/seasons.json gets its data file. Only one run waits in the
# queue at a time, so name several seasons in one run rather than starting several runs.
name: Refresh league data

on:
  schedule:
    # Scoring periods end Monday and Friday evening ET (16:00 or 19:00), so a run early on Tuesday and
    # Saturday (UTC) has the new results; the daily run picks up later stat corrections, and stands in
    # when GitHub delays or skips a scheduled run (it does when busy). Every run re-reads every period
    # of the current season. Minutes off the hour: GitHub is busiest at the top of it.
    - cron: "17 2 * * 2,6"
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Only these seasons, e.g. 2021-22 or 2020-21,2019-20 (empty: every season still in progress)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Build data from Fantrax
        run: python pipeline/build_data.py ${SEASON:+--season "$SEASON"}
        env:
          SEASON: ${{ inputs.season }}
          # A logged-in browser's Fantrax cookie (see pipeline/fantrax.py)
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}

      - name: Commit if anything changed
        # Also after a failed build: the seasons that did build are kept (the run still shows as failed)
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain -- stats-app/public/data)" ]; then
            echo "Data unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats-app/public/data
          git commit -m "Update league data"
          git push
