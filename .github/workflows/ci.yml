# Checks every pull request (and main) before it can break the live site.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    name: Pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - run: pip install -r pipeline/requirements-dev.txt
      - run: python -m pytest
        working-directory: pipeline

  web:
    name: Lint and build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stats-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: stats-app/.nvmrc
          cache: npm
          cache-dependency-path: stats-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
